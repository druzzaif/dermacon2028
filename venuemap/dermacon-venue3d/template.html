<style>
/* Layout: one full-screen 3D scene; a wayfinding panel floats top-left, view controls top-right. Single dark-chrome theme over a daylight scene. */
:root{
  --ink:#16132a;        /* panel and sign background */
  --paper:#f3f0f7;      /* text on ink */
  --accent:#d63d86;     /* DERMACON magenta: selection, destination */
  --route:#19b5ff;      /* walking route */
  --plum:#4a1766;       /* building labels, fascia */
  --sky:#bcd3e6;        /* page background behind the canvas */
  --credit-h:calc(40px + env(safe-area-inset-bottom,0px)); /* height of the credit bar; the 3D map ends above it */
  --font-display:"Barlow Condensed","Barlow","Segoe UI",sans-serif;
  --font-body:"Barlow","Segoe UI",system-ui,sans-serif;
  --dv3-font:var(--font-body); --dv3-display:var(--font-display);
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--sky);color:var(--paper);font-family:var(--font-body);overflow:hidden}
#app{position:absolute;top:0;left:0;right:0;bottom:var(--credit-h)}
#credit{position:fixed;left:0;right:0;bottom:0;z-index:60;height:var(--credit-h);box-sizing:border-box;padding:0 12px env(safe-area-inset-bottom,0px);display:flex;align-items:center;justify-content:center;gap:12px;background:var(--ink);border-top:1px solid rgba(255,255,255,.12);color:#fff;font:600 14px/1.2 var(--font-body);white-space:nowrap}
#credit .name{color:var(--accent);font-weight:700}
#credit .deg{color:#d8d2ea;font-weight:500}
@media (max-width:480px){#credit{gap:8px;font-size:12px;padding-left:8px;padding-right:8px}#credit a{padding:3px 8px 3px 6px}#credit svg{width:15px;height:15px}#credit .by{display:none}}
#credit a{display:inline-flex;align-items:center;gap:6px;color:#fff;text-decoration:none;padding:4px 11px 4px 8px;border-radius:999px;background:rgba(37,211,102,.14);border:1px solid rgba(37,211,102,.55);font-variant-numeric:tabular-nums}
#credit a:hover{background:rgba(37,211,102,.26)}
#credit a:focus-visible{outline:2px solid #fff;outline-offset:2px}
#credit svg{width:17px;height:17px;flex:none}
@media (max-width:380px){#credit{gap:8px;font-size:13px}}
#boot{position:absolute;inset:0;z-index:50;display:grid;place-items:center;background:var(--ink);transition:opacity .5s;text-align:center;padding:24px}
#boot h1{margin:0;font-family:var(--font-display);font-size:40px;letter-spacing:.05em;font-weight:700}
#boot h1 b{color:var(--accent)}
#boot p{margin:8px 0 0;color:#b9b3cc;font-size:15px}
@media (prefers-reduced-motion:reduce){#boot{transition:none}}
</style>
