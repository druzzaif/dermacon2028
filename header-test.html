<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Header Test</title>
</head>
<body style="background-color: #e5e5e5; padding: 40px; margin: 0;">

  <!-- Header Band Container -->
  <div style="
    max-width: 800px; 
    margin: 0 auto; 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    background-color: #f7f5f8; 
    border-bottom: 5px solid #a60f62; 
    padding: 15px 30px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  ">

    <!-- LEFT: IADVL Logo -->
    <div style="width: 15%; text-align: left;">
      <img src="templates/iadlvlogo.png" style="width: 100%; max-width: 90px; height: auto;" alt="IADVL">
    </div>

    <!-- MIDDLE: DERMACON Logo -->
    <div style="width: 45%; text-align: center;">
      <img src="templates/dermaconlogo.png" style="width: 100%; max-width: 300px; height: auto;" alt="DERMACON 2027">
    </div>

    <!-- RIGHT: Typography Block -->
    <div style="
      width: 35%; 
      font-family: Arial, sans-serif; 
      font-size: 11.5px; 
      font-weight: bold; 
      color: #000000; 
      line-height: 1.4;
      text-align: left;
    ">
      3rd International &<br>
      55th National Conference<br>
      of Indian Association of<br>
      Dermatologist,<br>
      Venereologists & Leprologists
    </div>

  </div>

</body>
</html>
